# Builds the image in Azure and rolls it out on every push to main.
# One-time setup: ./infra/azure/deploy.sh, then ./infra/azure/setup-github.sh
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OpenID Connect login to Azure, no stored passwords
  contents: read

concurrency:
  group: deploy-azure
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR: ${{ vars.AZURE_ACR_NAME }}
      APP: ${{ vars.AZURE_CONTAINER_APP }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the frontend builds
        working-directory: frontend
        run: npm ci && npm run build

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in Azure Container Registry
        run: |
          TAG=${GITHUB_SHA::12}
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          az acr build -r "$ACR" -t "tabletap:$TAG" -t tabletap:latest . -o none

      - name: Roll out new revision
        run: |
          SERVER=$(az acr show -n "$ACR" --query loginServer -o tsv)
          az containerapp update -g "$RG" -n "$APP" --image "$SERVER/tabletap:$TAG" -o none

      - name: Smoke test
        run: |
          URL="https://$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)"
          for i in $(seq 1 40); do
            curl -fs "$URL/actuator/health" | grep -q UP && { echo "Healthy: $URL"; exit 0; }
            sleep 6
          done
          echo "Deployed revision is not healthy"; exit 1
