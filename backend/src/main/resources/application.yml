server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tabletap}
    username: ${DB_USER:tabletap}
    password: ${DB_PASSWORD:tabletap}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update   # swap for Flyway migrations before going to production
    properties:
      hibernate.jdbc.time_zone: UTC

management:
  endpoints.web.exposure.include: health
  endpoint.health.probes.enabled: true

app:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}   # empty = billing provider off (usage is still calculated)
    currency: ${STRIPE_CURRENCY:nzd}
    api-base: ${STRIPE_API_BASE:https://api.stripe.com}
  sync:
    url: ${CLOUD_SYNC_URL:}          # cloud TableTap to send changes to (empty = off)
    site-key: ${CLOUD_SYNC_KEY:}
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-please}
    ttl-hours: ${JWT_TTL_HOURS:12}
  admin:
    email: ${ADMIN_EMAIL:admin@tabletap.local}
    password: ${ADMIN_PASSWORD:ChangeMe123!}
  demo:
    enabled: ${DEMO_DATA:true}
    password: ${DEMO_PASSWORD:Password123!}
  billing:
    monthly-fee-per-restaurant: ${BILLING_RESTAURANT_FEE:29.00}
    fee-per-order: ${BILLING_ORDER_FEE:0.05}
    floor-plan-fee: ${BILLING_FLOOR_PLAN_FEE:10.00}   # monthly add-on per restaurant with a floor plan
